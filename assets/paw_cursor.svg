<svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 36 36" fill="none">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000" flood-opacity="0.6"/>
      <feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="#5ce1e6" flood-opacity="0.8"/>
    </filter>
    <linearGradient id="padGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#5ce1e6"/>
      <stop offset="100%" stop-color="#00d2d3"/>
    </linearGradient>
    <linearGradient id="toeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#5ce1e6"/>
    </linearGradient>
  </defs>

  <g filter="url(#glow)">
    <!-- Main Pad -->
    <path d="M 18 17 C 13.5 17 10 20 10.5 24.5 C 11 28 14 30 18 30 C 22 30 25 28 25.5 24.5 C 26 20 22.5 17 18 17 C 16.8 17 16 17.5 18 17.5 Z" fill="url(#padGrad)" stroke="#ffffff" stroke-width="1.2"/>
    
    <!-- Toe 1 (Leftmost) -->
    <ellipse cx="8" cy="16" rx="2.6" ry="3.8" transform="rotate(-32 8 16)" fill="url(#toeGrad)" stroke="#ffffff" stroke-width="1.2"/>
    
    <!-- Toe 2 (Inner Left) -->
    <ellipse cx="13.5" cy="11.5" rx="3" ry="4.3" transform="rotate(-12 13.5 11.5)" fill="url(#toeGrad)" stroke="#ffffff" stroke-width="1.2"/>
    
    <!-- Toe 3 (Inner Right) -->
    <ellipse cx="22.5" cy="11.5" rx="3" ry="4.3" transform="rotate(12 22.5 11.5)" fill="url(#toeGrad)" stroke="#ffffff" stroke-width="1.2"/>
    
    <!-- Toe 4 (Rightmost) -->
    <ellipse cx="28" cy="16" rx="2.6" ry="3.8" transform="rotate(32 28 16)" fill="url(#toeGrad)" stroke="#ffffff" stroke-width="1.2"/>
  </g>
</svg>
